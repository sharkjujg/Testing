[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipforge"
version = "0.1.0"
description = "Automatically find, reformat and post big streamers' best clips to TikTok and Instagram Reels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clipforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
